name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --check
      - name: Compile Slint desktop and Rust backends
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

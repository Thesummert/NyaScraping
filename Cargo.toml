[workspace]
resolver = "2"
members = ["apps/desktop", "crates/*"]
default-members = ["apps/desktop"]
exclude = ["backends/NyaScrapingCore"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
nya-domain = { path = "crates/domain" }
nya-application = { path = "crates/application" }
nya-debug-adapter = { path = "crates/debug-adapter" }
nya-text-backend = { path = "crates/text-backend" }
nya-firmware-backend = { path = "crates/firmware-backend" }
object = { version = "0.36.7", default-features = false, features = ["read", "std", "compression"] }
gimli = { version = "0.31.1", default-features = false, features = ["read", "std", "endian-reader"] }
nya-scraping-core = { path = "backends/NyaScrapingCore" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
slint-build = "=1.18.1"
encoding_rs = "0.8"
chardetng = "1.0"
tempfile = "3"

# The desktop uses CPU rendering; unoptimized HiDPI redraws block the event loop.
# Keep debug symbols and assertions while optimizing the interactive build.
[profile.dev]
opt-level = 1

[profile.dev.package.i-slint-core]
opt-level = 2

[profile.dev.package.i-slint-renderer-software]
opt-level = 3

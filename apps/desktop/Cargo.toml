[package]
name = "nya-scraping"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
slint = { workspace = true, features = ["raw-window-handle-06", "unstable-winit-030"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile.workspace = true
nya-domain.workspace = true
nya-application.workspace = true
nya-debug-adapter.workspace = true
nya-text-backend.workspace = true
nya-firmware-backend.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[build-dependencies]
slint-build.workspace = true
